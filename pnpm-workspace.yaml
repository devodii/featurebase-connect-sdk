packages:
  - packages/*
  - integrations/*
  - integrations/n8n/node

# esbuild's postinstall just fetches its platform binary (needed to bundle the n8n
# node's build). None of the rest are needed for this workspace's build/lint/test/pack
# pipeline (verified: all pass without approving any of them), so they stay denied,
# following least-privilege for installs.
allowBuilds:
  cpu-features: false
  esbuild: true
  eslint-plugin-n8n-nodes-base: false
  isolated-vm: false
  ssh2: false
  unrs-resolver: false
