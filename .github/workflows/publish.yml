# Versions and publishes the n8n community node package with Changesets.
#
# Changesets is scoped to integrations/n8n/node only (see its .changeset/
# config.json) and treated as a standalone, single-package project there -
# it is not part of the pnpm workspace at the repo root.
#
# ─── HOW THIS WORKS ─────────────────────────────────────────────────────────
#
# 1. Contributors describe their change with `npx changeset add` (run from
#    integrations/n8n/node) and commit the generated .changeset/*.md file
#    alongside their change.
# 2. On every push to main, this workflow runs. If there are unreleased
#    changesets, changesets/action opens or updates a "Version Packages" pull
#    request that bumps package.json's version, updates CHANGELOG.md, and
#    removes the consumed changeset files.
# 3. Merging that pull request pushes to main with no pending changesets, so
#    the next run of this workflow instead lints, builds, and publishes to
#    npm with a provenance attestation - satisfying n8n's May 1 2026
#    requirement that all community nodes publish via GitHub Actions with
#    provenance.
#
# package.json's `prepublishOnly` script (`n8n-node prerelease`) still guards
# against an accidental `npm publish`: it only allows the publish to proceed
# when `RELEASE_MODE=true` is set, which this workflow sets for the real,
# CI-driven publish below.
#
# ─── ONE-TIME SETUP ─────────────────────────────────────────────────────────
#
# In GitHub: Settings -> Secrets and variables -> Actions -> New repository
# secret. Name it NPM_TOKEN and paste an npm granular access token scoped to
# this package with "Read and write" publish permission.

name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Version or publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n/node

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: integrations/n8n/node/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install core's dependencies
        working-directory: packages/core
        run: npm install

      - name: Install dependencies
        run: npm ci

      - name: Create Version Packages PR or publish to npm
        uses: changesets/action@v1
        with:
          cwd: integrations/n8n/node
          publish: npm run ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
